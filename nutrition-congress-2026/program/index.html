<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>2026 Provincial Nutrition Congress — Program</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: auto !important;
      min-height: 100% !important;
      overflow-y: auto !important;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh !important;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #0A0402;
      color: #FFF8E7;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(10px, 2vw, 20px) clamp(8px, 2vw, 16px) 40px;
    }

    .container {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Minimal Floating Top Header Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(26, 12, 6, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(250, 198, 17, 0.4);
      border-radius: 14px;
      position: sticky;
      top: 10px;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    .back-link {
      color: #DFC4AA;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }
    .back-link:hover { color: #FAC611; }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #FAC611, #D49000);
      color: #1F0D07;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .download-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    /* Program Sheets Stack */
    .pages-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .program-sheet {
      background: #FFFFFF;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 1px rgba(250, 198, 17, 0.5);
      width: 100%;
    }

    .program-sheet img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* Minimal Footer */
    footer {
      text-align: center;
      color: #8C7565;
      font-size: 0.78rem;
      padding: 16px 0 8px;
    }
    footer a { color: #FAC611; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Minimal Top Control Bar -->
    <header class="top-bar">
      <a class="back-link" href="../index.html">← Portal</a>
      <a class="download-btn" href="../program.pdf" target="_blank" download="2026-Provincial-Nutrition-Congress-Program.pdf">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download PDF (1.9 MB)
      </a>
    </header>

    <!-- Program Itself (All 5 Pages) -->
    <main class="pages-stack">
      <div class="program-sheet" id="page-1">
        <img src="../program-assets/1.png" alt="2026 Provincial Nutrition Congress Program - Page 1" loading="eager" />
      </div>

      <div class="program-sheet" id="page-2">
        <img src="../program-assets/2.png" alt="2026 Provincial Nutrition Congress Program - Page 2" loading="eager" />
      </div>

      <div class="program-sheet" id="page-3">
        <img src="../program-assets/3.png" alt="2026 Provincial Nutrition Congress Program - Page 3" loading="lazy" />
      </div>

      <div class="program-sheet" id="page-4">
        <img src="../program-assets/4.png" alt="2026 Provincial Nutrition Congress Program - Page 4" loading="lazy" />
      </div>

      <div class="program-sheet" id="page-5">
        <img src="../program-assets/5.png" alt="2026 Provincial Nutrition Congress Program - Page 5" loading="lazy" />
      </div>
    </main>

    <!-- Minimal Footer -->
    <footer>
      2026 Provincial Nutrition Congress and Awarding Ceremony · Province of Davao del Norte
    </footer>
  </div>
</body>
</html>
